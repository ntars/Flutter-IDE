# CI：多版本矩阵 + 零告警门槛。
#
# 三条门槛都对应方案 §15 的验收标准：
# - analyze 零 error 零 warning → 生成物与手写物过同一套检查；
# - test 全绿 → 内核逻辑可脱离 IDE 验证；
# - validate 模板 → 校验规则与文档示例同步（文档示例即契约）。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: analyze + test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 锁定支持版本区间（方案 §11.3：上游变更风险）。骨架阶段只测本机版本，
        # 阶段一扩展矩阵时在这里加版本即可。
        flutter: ["3.50.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: dart analyze
      - run: dart test
      - name: validate templates
        run: dart run packages/cli/bin/fide.dart validate --project templates/starter_app
