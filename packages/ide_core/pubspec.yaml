name: fide_core
description: "Fide 内核：意图大纲、覆盖层、codegen、区间写回、校验。纯 Dart，无 Flutter 依赖，可独立 CLI 调用。"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.14.0
resolution: workspace

dependencies:
  # 令牌与断点表是内核的输入，不是 UI 的一部分。
  fide_design: ^0.1.0
  # 物料协议由 SDK 定义，内核只实现它。
  fide_material_sdk: ^0.1.0
  # AST 解析与源码定位：写回靠它算区间。
  analyzer: ^14.7.0
  # VM Service 客户端：点选与热重载。
  vm_service: ^15.4.0
  # intent / delta 是 YAML。
  yaml: ^3.1.4
  path: ^1.9.1

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
